<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="application" content="qa-shop">
  <title>Лавка — кофе, чай и аксессуары</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <div class="wrap header__row">
      <a class="logo" href="#/">Лавка</a>
      <nav class="nav" aria-label="Основное меню">
        <a href="#/">Каталог</a>
        <a href="#/orders" id="nav-orders" hidden>Мои заказы</a>
      </nav>
      <div class="header__right">
        <span id="user-name" class="user-name" hidden></span>
        <a href="#/login" id="nav-login">Войти</a>
        <button type="button" id="nav-logout" class="link" hidden>Выйти</button>
        <a href="#/cart" class="cart-link" data-testid="cart-link">Корзина <span id="cart-count" class="badge" data-testid="cart-count">0</span></a>
      </div>
    </div>
  </header>

  <main class="wrap" id="app" aria-live="polite"></main>

  <div id="toast" class="toast" role="status" hidden></div>

  <footer class="footer">
    <div class="wrap">Лавка · учебный интернет-магазин · доставка курьером 300 ₽, бесплатно от 3000 ₽</div>
  </footer>

  <script src="app.js"></script>
</body>
</html>
